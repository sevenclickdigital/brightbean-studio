# Dokploy deployment (Docker Compose application type).
#
# Standalone file — do NOT combine it with docker-compose.yml /
# docker-compose.prod.yml. Point Dokploy's "Compose Path" at this file alone.
#
# Differences from docker-compose.prod.yml:
#   - No Caddy. Dokploy's own Traefik terminates TLS and reverse-proxies, so a
#     second proxy binding :80/:443 would collide with it. Django's /media/
#     route serves uploads instead (SERVE_MEDIA=true, the default) — fine for
#     modest traffic; switch STORAGE_BACKEND=s3 once media volume grows, since
#     Django's static serve has no byte-range support (no video seeking).
#   - No host port publishing. Traefik reaches the app over the Docker network;
#     publishing 8000 on the host would expose it bypassing TLS.
#   - Env vars come from Dokploy's Environment tab, not an .env file: Dokploy
#     writes that tab to a .env next to this file and interpolates it here.
#
# In Dokploy, add a Domain pointing to service `app`, container port `8000`.
services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: python manage.py migrate --noinput
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY_SALT: ${ENCRYPTION_KEY_SALT}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/brightbean}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      APP_URL: ${APP_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Same sizing rationale as the Dockerfile CMD: ~200 MB per warmed worker.
    # Raise --workers only alongside the container's memory limit.
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 4
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/brightbean}
      MEDIA_ROOT: /app/media
      # The Dockerfile reports the host's core count, so glibc's per-thread
      # arena cap is effectively unbounded here. .profile is not read by this
      # image. See README "MALLOC_ARENA_MAX".
      MALLOC_ARENA_MAX: 2
    volumes:
      - media_data:/app/media
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    # No --duration: this restart policy does not depend on clean-exit
    # recycling the way Heroku's does.
    command: python manage.py run_studio_worker
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/brightbean}
      MEDIA_ROOT: /app/media
      MALLOC_ARENA_MAX: 2
    volumes:
      - media_data:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Drop this service (and the postgres_data volume + depends_on above) if you
  # provision Postgres in Dokploy's own Databases tab and set DATABASE_URL to
  # its internal connection string.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brightbean
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brightbean"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
